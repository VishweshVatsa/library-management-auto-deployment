{% extends "base.html" %}
{% block content %}
<h1>Books</h1>
<form class="inline" method="post">
  <input name="title" placeholder="Title" required aria-label="Title">
  <input name="author" placeholder="Author" required aria-label="Author">
  <input name="copies" type="number" min="1" value="1" aria-label="Copies" style="width:80px">
  <button type="submit">Add book</button>
</form>
{% if books %}
<div class="tablewrap"><table>
  <tr><th>Title</th><th>Author</th><th>Available</th><th></th></tr>
  {% for b in books %}
  <tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.available }} of {{ b.copies }}</td>
  <td><form method="post" action="{{ url_for('delete_book', book_id=b.id) }}"><button class="link">Delete</button></form></td></tr>
  {% endfor %}
</table></div>
{% else %}<p class="empty">No books yet. Add the first one above.</p>{% endif %}
{% endblock %}
